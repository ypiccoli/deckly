<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Deckly</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="cabecalho">
      <div class="cabecalho-titulo">
        <span class="logo">🕹️</span>
        <span>Deckly</span>
      </div>
      <nav class="abas" id="abas"></nav>
      <div class="status-conexao" id="status-conexao" title="Estado da conexão">
        <span class="status-ponto"></span>
        <span class="status-texto">conectando…</span>
      </div>
      <a class="link-config" href="config/" title="Configurar botões">⚙️</a>
    </header>

    <main class="grade" id="grade"></main>
  </div>

  <div class="overlay-lista" id="overlay-lista">
    <div class="overlay-cartao">
      <h2 id="overlay-titulo">Escolha</h2>
      <div class="lista-opcoes" id="lista-opcoes"></div>
      <button type="button" class="overlay-fechar" id="overlay-fechar">Cancelar</button>
    </div>
  </div>

  <script src="js/token.js"></script>
  <script src="js/ws-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
